name: probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /dev/null -w 'scryfall %{http_code}\n' 'https://api.scryfall.com/cards/named?exact=Sol+Ring'
          curl -s -o /dev/null -w 'cdn %{http_code}\n' 'https://d8j0ntlcm91z4.cloudfront.net/user_3MBpZ643qhHhGn8CmuuGhr7oLkU/hf_20261117_214351_cb02d3a9-9d89-4e76-8481-f04fcc81a7e0.png'
          curl -s -o /dev/null -w 'site %{http_code}\n' 'https://georgesmarieyazigi-code.github.io/Proxy-table/'
          mkdir out && echo hi > out/a.txt
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: out}
